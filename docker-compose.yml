# =============================================
# GESAP - Docker Compose
# Desarrollo: docker compose up -d
# Producción: docker compose --env-file .env.prod up -d --build
# =============================================
#
# Puertos del HOST (acceso desde tu PC):
#   PostgreSQL  → localhost:5433
#   gesap-api   → localhost:3100
#   gesap-auditor          → localhost:3101
#   gesap-patient-portal   → localhost:3102
#   Panel Admin    → localhost:4000
#   Portal Auditor → localhost:4001
#   Portal Clínico → localhost:4002
#   Portal Paciente→ localhost:4003
# =============================================

services:
  # ── Base de datos ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: gesap-postgres
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    ulimits:
      nproc:
        soft: 512
        hard: 512
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-gesap_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - gesap-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gesap_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── API principal (interno: 3000 | host: 3100) ────────────────────────────
  gesap-api:
    build: ./gesap-api
    container_name: gesap-api
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ulimits:
      nproc:
        soft: 512
        hard: 512
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      PORT: ${PORT_API:-3000}
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-gesap_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-x7K9mP2vQ8nR4wL6jH3cF1bA5dY0uT8sE2gN6iO9pX4zM7kJ5r}
      JWT_EXPIRES_IN: 24h
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gesap-network

  # ── Servicio de auditoría (interno: 3001 | host: 3101) ───────────────────
  gesap-auditor:
    build: ./gesap-auditor
    container_name: gesap-auditor
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ulimits:
      nproc:
        soft: 512
        hard: 512
    ports:
      - "127.0.0.1:3101:3001"
    environment:
      PORT: ${PORT_AUDITOR:-3001}
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-gesap_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-x7K9mP2vQ8nR4wL6jH3cF1bA5dY0uT8sE2gN6iO9pX4zM7kJ5r}
      JWT_EXPIRES_IN: 24h
    depends_on:
      postgres:
        condition: service_healthy
      gesap-api:
        condition: service_started
    networks:
      - gesap-network

  # ── Portal de pacientes (interno: 3002 | host: 3102) ─────────────────────
  gesap-patient-portal:
    build: ./gesap-patient-portal
    container_name: gesap-patient-portal
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ulimits:
      nproc:
        soft: 512
        hard: 512
    ports:
      - "127.0.0.1:3102:3002"
    environment:
      PORT: ${PORT_PATIENT:-3002}
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-gesap_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-x7K9mP2vQ8nR4wL6jH3cF1bA5dY0uT8sE2gN6iO9pX4zM7kJ5r}
      JWT_EXPIRES_IN: 24h
    depends_on:
      postgres:
        condition: service_healthy
      gesap-api:
        condition: service_started
    networks:
      - gesap-network

  # ── nginx — sirve frontends + reverse proxy ────────────────────────────────
  # Solo activo en producción (los frontends deben estar ya compilados en ./www/)
  # Para compilar: bash scripts/build-frontends.sh
  nginx:
    image: nginx:alpine
    container_name: gesap-nginx
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www/client-api:/var/www/client-api:ro
      - ./www/client-auditor:/var/www/client-auditor:ro
      - ./www/client-patient:/var/www/client-patient:ro
    depends_on:
      - gesap-api
      - gesap-auditor
      - gesap-patient-portal
    networks:
      - gesap-network
    profiles:
      - production

volumes:
  postgres_data:

networks:
  gesap-network:
    driver: bridge
