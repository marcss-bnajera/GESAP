# GESAP — nginx reverse proxy para producción
# Dominio único: gesap.lat
# Rutas por path (no por subdominio):
#   /           → Portal Pacientes   (client-patient-gesap)
#   /auditor/   → Portal Auditor     (client-auditor-gesap)
#   /clinico/   → Portal Clínico     (client-api-gesap: DOCTOR + asistentes + emergencias)
#
# Atajos de acceso rápido:
#   /medico        → 302 /clinico/login
#   /emergencias   → 302 /clinico/emergencias/login
#
# WebSockets diferenciados por path (evita conflicto /socket.io/ en un solo dominio):
#   /api-ws/       → gesap-api (kick clínico + emergency:new)
#   /auditor-ws/   → gesap-auditor (kick auditor + sessions:changed)

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # ── Upstreams ────────────────────────────────────────────────────────────
    upstream gesap_api {
        server gesap-api:3000;
    }
    upstream gesap_auditor {
        server gesap-auditor:3001;
    }
    upstream gesap_patient_portal {
        server gesap-patient-portal:3002;
    }

    server {
        listen 80;
        server_name gesap.lat;

        # ── Atajos de acceso rápido ──────────────────────────────────────────
        location = /medico      { return 302 /clinico/login; }
        location = /doctor      { return 302 /clinico/login; }
        location = /emergencias { return 302 /clinico/emergencias/login; }
        location = /auditor     { return 301 /auditor/; }
        location = /clinico     { return 301 /clinico/; }

        # ── Portal Auditor: /auditor/ ────────────────────────────────────────
        location /auditor/ {
            alias /var/www/client-auditor/;
            try_files $uri $uri/ /auditor/index.html;
        }

        # ── Portal Clínico + Emergencias: /clinico/ ──────────────────────────
        location /clinico/ {
            alias /var/www/client-api/;
            try_files $uri $uri/ /clinico/index.html;
        }

        # ── API gesap-api (portal clínico y emergencias) ─────────────────────
        location /gesap/v1/ {
            proxy_pass http://gesap_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # ── API gesap-auditor ────────────────────────────────────────────────
        location /gesap-auditor/v1/ {
            proxy_pass http://gesap_auditor;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # ── API gesap-patient-portal ─────────────────────────────────────────
        location /gesap-portal/v1/ {
            proxy_pass http://gesap_patient_portal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # ── WebSocket gesap-api: /api-ws/ ────────────────────────────────────
        # Handles: session:kicked (clínico) + emergency:new (recepción)
        location /api-ws/ {
            proxy_pass http://gesap_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ── WebSocket gesap-auditor: /auditor-ws/ ────────────────────────────
        # Handles: session:kicked (auditor) + sessions:changed
        location /auditor-ws/ {
            proxy_pass http://gesap_auditor;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ── Portal Pacientes: / (catch-all) ──────────────────────────────────
        # IMPORTANTE: debe ir al final; las rutas más específicas arriba tienen prioridad
        location / {
            root /var/www/client-patient;
            try_files $uri $uri/ /index.html;
        }
    }
}
